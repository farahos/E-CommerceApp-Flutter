name: e_commerce_app
description: A complete e-commerce application with Flutter
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP Client
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Form Validation
  form_validator: 2.1.1
  
  # Image Loading
  cached_network_image: ^3.3.0
  
  # Icons
  flutter_svg: ^2.0.9
  
  # Navigation
  go_router: ^12.0.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  
  # Socket.io
  socket_io_client: ^2.0.3
  
  # Image Picker
  image_picker: ^1.0.4
  
  # File Picker
  file_picker: ^6.1.1
  
  # Badge for cart items
  badges: ^3.0.0
  
  # Number formatting
  intl: ^0.18.1
  
  # URL launcher
  url_launcher: ^6.1.10
  
  # Connectivity
  connectivity_plus: ^5.0.0
  
  # Pull to refresh
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700