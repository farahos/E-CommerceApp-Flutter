name: ecommerce_app
description: A Flutter web e-commerce application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===============================
  # Networking
  # ===============================
  dio: ^5.3.0
  http: ^1.1.0
  socket_io_client: ^2.0.3

  # ===============================
  # State Management & Routing
  # ===============================
  provider: ^6.1.1
  go_router: ^13.0.0

  # ⚠️ riverpod removed (you are not using it)
  # riverpod: ^2.4.9

  # ===============================
  # Storage & Localization
  # ===============================
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # ===============================
  # File & Image Handling
  # ===============================
  image_picker_web: ^3.0.2
  file_picker: ^6.1.1
  cached_network_image: ^3.3.0

  # ===============================
  # UI & UX
  # ===============================
  flutter_rating_bar: ^4.0.1
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.2.2
  font_awesome_flutter: ^10.6.0
  animations: ^2.0.9
  carousel_slider: ^4.2.1
  badges: ^3.0.3
  pull_to_refresh: ^2.0.0
  readmore: ^3.0.0
  shimmer: ^3.0.0
  loading_animation_widget: ^1.2.0

  # ===============================
  # Forms & Validation
  # ===============================
  form_validator: ^1.0.0

  # ===============================
  # Feedback
  # ===============================
  fluttertoast: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # ===============================
  # Fonts
  # ===============================
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # ===============================
  # Assets (NO DUPLICATION)
  # ===============================
  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/images/banners/
    - assets/images/categories/
    - assets/images/products/
    - assets/icons/categories/
    - assets/icons/payment/
    - assets/icons/social/
