name: ecommerce_app
description: A Flutter web e-commerce application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  dio: ^5.3.0
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  image_picker_web: ^3.0.2  # For web image uploads

  # UI packages
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  flutter_spinkit: ^5.2.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/